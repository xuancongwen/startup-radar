# certstream-server-go config for a plain host (bare Linux or an LXC container): loopback only.
webserver:
  listen_addr: "127.0.0.1"
  listen_port: 8080
  real_ip: false
  whitelist:
    - "127.0.0.1/8"
  full_url: "/full-stream"
  lite_url: "/"
  domains_only_url: "/domains-only"
  compression_enabled: false
prometheus:
  enabled: false
